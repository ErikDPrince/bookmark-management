basePath: /
definitions:
  service.Response:
    properties:
      instance_id:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
      message:
        example: ok
        type: string
      service_name:
        example: bookmark-management
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Default listen port is 8080 (APP_PORT). Swagger Try it out uses @host
    below — run the server on the same port (unset APP_PORT or APP_PORT=8080).
  title: Bookmark Management API
  version: "1.0"
paths:
  /health-check:
    get:
      consumes:
      - application/json
      description: Check health
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.Response'
      summary: Check health
      tags:
      - Health
  /password:
    get:
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Generate a password
      tags:
      - Password
schemes:
- http
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
