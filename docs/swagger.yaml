basePath: /
definitions:
  handler.ShortenURLRequest:
    properties:
      url:
        type: string
    required:
    - url
    type: object
  service.Response:
    properties:
      instance_id:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
      message:
        example: ok
        type: string
      service_name:
        example: bookmark-management
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Default listen port is 8080 (APP_PORT). Swagger Try it out uses @host
    below — run the server on the same port (unset APP_PORT or APP_PORT=8080).
  title: Bookmark Management API
  version: "1.0"
paths:
  /health-check:
    get:
      consumes:
      - application/json
      description: Check health
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.Response'
      summary: Check health
      tags:
      - Health
  /password:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Generate a password
      tags:
      - Password
  /v1/links/{code}:
    get:
      description: Looks up the code in Redis and responds with HTTP 301 Moved Permanently;
        the Location header is the original URL.
      parameters:
      - description: Short code
        in: path
        name: code
        required: true
        type: string
      responses:
        "301":
          description: Redirect (follow Location header)
          headers:
            Location:
              description: Original URL
              type: string
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Resolve short link
      tags:
      - Links
  /v1/links/shorten:
    post:
      consumes:
      - application/json
      description: Generate random short code and store mapping URL
      parameters:
      - description: Shorten URL request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.ShortenURLRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Shorten URL
      tags:
      - Links
schemes:
- http
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
