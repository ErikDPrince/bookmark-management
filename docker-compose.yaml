version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: redis
    networks:
      - bookmark-management
      

  bookmark-management:
    build:
      context: .
      dockerfile: Dockerfile
    image: bookmark-management:test
    container_name: bookmark-management
    ports:
      - "8080:8080"
    environment:
      - REDIS_ADDR=redis:6379

    networks:
      - bookmark-management

networks:
  bookmark-management:
    driver: bridge